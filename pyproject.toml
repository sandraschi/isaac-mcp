[project]
name = "isaac-mcp"
version = "0.2.0"
description = "NVIDIA Isaac Sim/Lab simulation via MCP simulation via MCP"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.4.4,<4", "mujoco>=3.2", "httpx>=0.28", "fastapi>=0.115", "uvicorn[standard]>=0.34"]

[project.scripts]
isaac-mcp = "isaac_mcp:main"

[dependency-groups]
# NOTE: [project.optional-dependencies] dev is kept for CI (`uv sync --extra dev`);
# local `uv sync` uses this group - keep both lists in sync.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-mock>=3", "pytest-cov>=5", "httpx>=0.28", "ruff>=0.16.0,<0.17", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isaac_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# _sim_runner.py is a subprocess entrypoint: stderr prints are its log channel,
# not server-runtime logging (see BUG-017 scoping).
"src/isaac_mcp/_sim_runner.py" = ["T20"]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=isaac_mcp --cov-report=term-missing --cov-fail-under=40"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.16.0,<0.17"]
