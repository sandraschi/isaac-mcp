[project]
name = "isaac-mcp"
version = "0.2.0"
description = "General-purpose NVIDIA Isaac Sim/Lab wrapper via MCP"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.2", "httpx>=0.28", "fastapi>=0.115", "uvicorn[standard]>=0.34"]

[project.scripts]
isaac-mcp = "isaac_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isaac_mcp"]
